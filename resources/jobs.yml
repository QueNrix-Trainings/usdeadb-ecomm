
resources:
  jobs:
    ecommerce_pipeline:
      name: usdeadb-ecomm-pipeline

      job_clusters:
        - job_cluster_key: ecommerce_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 1

      tasks:
        - task_key: bronze_ingestion
          job_cluster_key: ecommerce_cluster
          notebook_task:
            notebook_path: ./src/bronze/ingest_orders.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: ecommerce_cluster
          notebook_task:
            notebook_path: ./src/silver/clean_orders.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold_aggregation
          depends_on:
            - task_key: silver_transformation
          job_cluster_key: ecommerce_cluster
          notebook_task:
            notebook_path: ./src/gold/sales_summary.py
            base_parameters:
              catalog: ${var.catalog}

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "Asia/Kolkata"
        pause_status: PAUSED
